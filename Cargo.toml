[package]
name = "stone"
default-run = "stone"
version = "0.4.3"
edition = "2024"
description = "A Python-like language with a tree-walking interpreter and an x86-64 and arm64 compiler"
license = "Apache-2.0"
repository = "https://github.com/tarolling/stone"
readme = "README.md"

# the language server is a separate crate, and self-update and fetch are opt-in, so a default
# build of stone depends only on clap
[workspace]
members = ["lsp"]
default-members = [".", "lsp"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "archive-tar",
    "compression-tar-gz",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
    "progress-bar",
], optional = true }

# `stone add` and `stone fetch`, which download packages over HTTPS. release.yml turns it on
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[lints.rust]
# cargo fuzz sets --cfg fuzzing, which `debug!` checks
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
# `stone update`, which downloads releases over HTTPS. release.yml turns it on
self-update = ["dep:self_update"]
# downloading packages from GitHub and GitLab releases. release.yml turns it on
fetch = ["dep:ureq", "dep:flate2", "dep:tar"]

# `cargo run -- build` is about 6x slower unoptimized; level 1 keeps debug info and assertions
[profile.dev]
opt-level = 1
