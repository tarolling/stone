name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Lint with self-update
      run: cargo clippy --all-targets --features self-update -- -D warnings
    - name: Build
      run: cargo build --verbose
    # the golden programs are also built for aarch64 and run under qemu-user, and the built-in
    # assembler is compared with GNU as for both processors
    - name: Install qemu and the aarch64 binutils
      run: sudo apt-get update && sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
    - name: Run tests
      run: cargo test --verbose
    - name: Run self-update tests
      run: cargo test --verbose --features self-update --bin stone
    - name: Lint the scripts
      run: shellcheck install.sh scripts/*.sh
    - name: Test the install script
      run: sh scripts/test-install.sh
    - name: Test the version bump script
      run: sh scripts/test-bump-version.sh
    - name: Test the changelog script
      run: sh scripts/test-changelog.sh
    - name: Test the VS Code extension
      working-directory: editors/vscode
      run: npm test

  # stone build targets the host, so this runs the arm64 backend natively
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust if the runner lacks it
      run: command -v rustup || curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - name: Build
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --verbose
    # the golden programs are also built for x86-64 and run under qemu-user
    - name: Install qemu and the x86-64 binutils
      run: sudo apt-get update && sudo apt-get install -y qemu-user binutils-x86-64-linux-gnu
    - name: Run tests
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo test --verbose

  fuzz:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install nightly and cargo-fuzz
      run: |
        rustup toolchain install nightly --profile minimal
        cargo install cargo-fuzz --locked
    - name: Test the program generator
      run: cargo test --manifest-path fuzz/Cargo.toml
    - name: Build fuzz targets
      run: cargo +nightly fuzz build
    # the differential target builds and runs a binary per input, so it is too slow for every push
    - name: Fuzz each crash target briefly
      run: |
        for target in lex parse interpret codegen structured; do
          cargo +nightly fuzz run "$target" -- -dict=fuzz/stone.dict -max_total_time=60 -timeout=10
        done
    - name: Upload crashing inputs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts
