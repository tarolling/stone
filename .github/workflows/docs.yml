name: Docs

# builds the Sphinx site in docs/ on every pull request that touches it, and publishes it to
# GitHub Pages on pushes to main. Pages must be set to deploy from "GitHub Actions" in the
# repository settings.
on:
  push:
    branches: [ "main" ]
    paths:
    - "docs/**"
    - "bench/README.md"
    - "Cargo.toml"
    - ".github/workflows/docs.yml"
  pull_request:
    branches: [ "main" ]
    paths:
    - "docs/**"
    - "bench/README.md"
    - "Cargo.toml"
    - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, but never cancel one that is already publishing
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: docs/requirements.txt
    - name: Install Sphinx
      run: pip install -r docs/requirements.txt
    # -W turns warnings such as broken links or includes into errors
    - name: Build the site
      run: sphinx-build -W --keep-going -b html docs docs/_build/html
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      if: github.event_name != 'pull_request'
      with:
        path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
