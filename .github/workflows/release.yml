name: Release

# pushing a tag like v0.1.0 builds stone for each target and publishes a GitHub
# release that install.sh downloads from. Running it by hand builds and tests
# the archives without publishing anything.
on:
  push:
    tags: [ "v[0-9]*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check the tag matches Cargo.toml
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
          exit 1
        fi

  build:
    needs: check-version
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          smoke: true
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          smoke: true
        - target: aarch64-apple-darwin
          runner: macos-latest
          smoke: true
        # cross-compiled on an arm64 runner, so it cannot run there
        - target: x86_64-apple-darwin
          runner: macos-latest
          smoke: false
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust if the runner lacks it
      run: command -v rustup || curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - name: Install musl tools
      if: contains(matrix.target, 'musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Add the target
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup target add ${{ matrix.target }}
    - name: Build
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release --locked -p stone --features self-update --target ${{ matrix.target }}
    - name: Smoke test
      if: matrix.smoke
      run: |
        stone=target/${{ matrix.target }}/release/stone
        $stone --version
        $stone update --help
        $stone uninstall --help
        $stone run examples/basics.st | diff - examples/basics.out
    # stone build targets Linux, where the runner's gcc assembles and links for its own processor
    - name: Smoke test the compiler
      if: matrix.smoke && contains(matrix.target, 'linux')
      run: |
        stone=target/${{ matrix.target }}/release/stone
        $stone build examples/basics.st -o build/basics
        ./build/basics | diff - examples/basics.out
    - name: Package
      run: |
        archive=stone-${{ matrix.target }}.tar.gz
        mkdir -p package dist
        cp target/${{ matrix.target }}/release/stone LICENSE README.md package/
        tar -czf dist/$archive -C package stone LICENSE README.md
        (cd dist && shasum -a 256 $archive > $archive.sha256)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: stone-${{ matrix.target }}
        path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: dist
        merge-multiple: true
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
