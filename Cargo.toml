[package]
name = "stone"
default-run = "stone"
version = "0.2.1"
edition = "2024"
description = "A Python-like language with a tree-walking interpreter and an x86-64 and arm64 compiler"
license = "Apache-2.0"
repository = "https://github.com/tarolling/stone"
readme = "README.md"

# the language server is a separate crate, and self-update is opt-in, so a default build of
# stone depends only on clap
[workspace]
members = ["lsp"]
default-members = [".", "lsp"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "archive-tar",
    "compression-tar-gz",
    "checksums",
    "progress-bar",
], optional = true }

[lints.rust]
# cargo fuzz sets --cfg fuzzing, which `debug!` checks
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
# `stone self-update`, which downloads releases over HTTPS. release.yml turns it on
self-update = ["dep:self_update"]
