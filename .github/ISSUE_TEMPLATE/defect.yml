name: Defect
description: Report a bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Some general tips:

        * Is this really a problem? Check the [language reference](https://tarolling.github.io/stone/) for what stone is meant to do.
        * Can this be contributed as a pull request with a failing test instead? A golden program in `tests/programs/` with the output it should print is the most useful kind (see the [contributing guide](https://github.com/tarolling/stone/blob/main/CONTRIBUTING.md)).

        **Security vulnerabilities** must not be reported here. Follow the [security policy](https://github.com/tarolling/stone/blob/main/SECURITY.md) instead.
  - type: checkboxes
    id: initial-checklist
    attributes:
      label: Initial checklist
      options:
        - label: I read the [contributing guide](https://github.com/tarolling/stone/blob/main/CONTRIBUTING.md)
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/tarolling/stone/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I searched [issues](https://github.com/tarolling/stone/issues?q=is%3Aissue) and couldn't find anything (or linked relevant results below)
          required: true
        - label: This is not a security vulnerability
          required: true
  - type: input
    id: affected-version
    attributes:
      label: Affected version
      description: |
        The output of `stone --version`, or the commit you built from.
        Please check whether the latest release (`stone update`) still has the problem.
        Example: `stone 0.2.6`.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem happen? Pick every one that applies.
      multiple: true
      options:
        - stone run (interpreter)
        - stone build (compiler, or the compiled program)
        - stone check (checker errors)
        - REPL
        - Language server or VS Code extension
        - install.sh, stone update, or stone uninstall
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Provide a [minimal and reproducible example](https://stackoverflow.com/help/minimal-reproducible-example): the smallest `.stn` program that shows the problem, and the exact command you ran.
        Remove everything that is not needed.
      placeholder: |
        ```stone
        xs = [1, 2, 3]
        print(xs[5])
        ```

        `stone build bug.stn && ./build/bug`
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: |
        What happens? Paste the full output, including any error message and the exit status.
        If `stone run` and `stone build` disagree, show both.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What should happen instead, and why?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: |
        For `stone build`, the target you built for (`x86_64-linux`, `aarch64-linux`, or `aarch64-macos`), or `host`.
    validations:
      required: false
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: |
        The system and processor you ran stone on.
        Example: `Ubuntu 24.04 on x86-64` or `macOS Sequoia 15.1.1 on Apple M2`.
    validations:
      required: false
